name: Code Checks

on:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:

env:
  NODE_VERSION: '22.22.0'
  NPM_VERSION: '11.19.1'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Setup npm
        run: npm install -g npm@${{ env.NPM_VERSION }} --min-release-age=7
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
