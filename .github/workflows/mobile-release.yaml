name: Mobile Release

on:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (ios, android, all)'
        required: true
        default: 'all'

env:
  NODE_VERSION: '22.22.0'
  NPM_VERSION: '11.19.1'
  EXPO_CLI_VERSION: '0.18.13'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

  lint-and-test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Setup npm
        run: npm install -g npm@${{ env.NPM_VERSION }} --min-release-age=7
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --coverage --passWithNoTests

  build-android:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup npm
        run: npm install -g npm@${{ env.NPM_VERSION }} --min-release-age=7
      - run: npm ci
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
      - name: Write keystore properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=bowery2024release!
          keyAlias=bowery-release
          keyPassword=bowery2024release!
          EOF
      - name: Build release APK
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ needs.setup.outputs.version }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    runs-on: macos-latest
    needs: lint-and-test
    if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Setup npm
        run: npm install -g npm@${{ env.NPM_VERSION }} --min-release-age=7
      - run: npm ci
      - name: Install pods
        working-directory: ios
        run: pod install
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$CERT_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$CERT_PASSWORD" $KEYCHAIN_PATH
          echo "$CERT_P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
      - name: Download provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/release.mobileprovision
      - name: Build archive
        run: |
          xcodebuild archive \
            -workspace ios/BoweryApp.xcworkspace \
            -scheme BoweryApp \
            -configuration Release \
            -archivePath $RUNNER_TEMP/BoweryApp.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/BoweryApp.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ needs.setup.outputs.version }}
          path: ${{ runner.temp }}/export/BoweryApp.ipa
          retention-days: 30

  deploy-eas-update:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Setup npm
        run: npm install -g npm@${{ env.NPM_VERSION }} --min-release-age=7
      - run: npm ci
      - name: Install EAS CLI
        run: npm install -g eas-cli@${{ env.EXPO_CLI_VERSION }} --min-release-age=7
      - name: Publish OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas update --auto --non-interactive

  notify-slack:
    runs-on: ubuntu-latest
    needs: [deploy-eas-update]
    if: always()
    steps:
      - name: Post result
        uses: slackapi/slack-github-action@v1
        with:
          payload: '{"text":"Mobile release pipeline finished — ${{ needs.deploy-eas-update.result }}"}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
